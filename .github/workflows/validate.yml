name: validate-project
on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: pytest -q
      - run: python -m json.tool "Mobile Game Efficiency & LTV Analysis.ipynb" > /dev/null
